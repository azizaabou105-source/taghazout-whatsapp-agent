name: Generate Taghazout Agency Crew

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and CrewAI
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Generate Project & Agency Files
        run: |
          if [ ! -f "pyproject.toml" ]; then
            uv tool install crewai
            crewai create crew taghazout_agency --skip_provider
            cp -rn taghazout_agency/* . || true
            rm -rf taghazout_agency
            
            cat << 'EOF' > src/taghazout_agency/config/agents.yaml
          whatsapp_concierge:
            role: >
              Taghazout Digital Agency WhatsApp Sales & Booking Specialist
            goal: >
              Respond to incoming WhatsApp messages ("{user_message}" from "{sender_phone}"), highlight how our 24/7 Blackbell booking system saves them 15-20% Booking.com commissions, and book a quick discovery call or demo.
            backstory: >
              You are the WhatsApp assistant for Taghazout Digital Agency, founded by a certified Blackbell AgencyLink specialist in Taghazout/Agadir.
              We help surf camps, surf schools, yoga retreats, riads, and tour operators in Taghazout and Tamraght automate their bookings and payments 24/7 in 48 hours.
              Key facts you know:
              - Main pain solved: Stop losing 15-20% commission to Booking.com and save 60%+ admin time replying manually to DMs.
              - Pack Essential: 3,500 DH setup + 1,200 DH/month.
              - Pack Full Camp: 6,500 DH setup + 1,900 DH/month.
              - Optional Social Media Management upsell: 800 DH/month.
              - Special Urgency Offer: Pioneer Partner Program (limited to 5 local businesses).
              - Proof of work: We can send a 2:30 min French voiceover demo video or show a live cloned surf camp booking page.
              Always reply in the exact language the prospect uses (French, English, or Moroccan Darija). Keep replies under 3 short sentences and end with a clear question to send them the 2:30 demo video or book a 15-minute discovery call.
            llm: gemini/gemini-2.5-flash
          EOF

            cat << 'EOF' > src/taghazout_agency/config/tasks.yaml
          reply_whatsapp_task:
            description: >
              A prospect with phone number {sender_phone} sent this WhatsApp message: "{user_message}".
              1. Answer their question directly using our real pricing (Pack Essential 3,500 DH + 1,200 DH/mo or Pack Full Camp 6,500 DH + 1,900 DH/mo) or our Booking.com 15-20% commission savings argument.
              2. Mention our Pioneer Partner Program (only 5 spots) if they ask about discounts or getting started.
              3. Ask if they want to see the 2-minute demo video or book a quick 15-minute discovery call.
            expected_output: >
              A friendly, natural WhatsApp reply under 65 words in the user's language (French, English, or Darija), formatted as plain text with no markdown headers.
            agent: whatsapp_concierge
          EOF

            cat << 'EOF' > src/taghazout_agency/crew.py
          from crewai import Agent, Crew, Process, Task
          from crewai.project import CrewBase, agent, crew, task

          @CrewBase
          class TaghazoutAgency():
              """TaghazoutAgency crew"""
              agents_config = 'config/agents.yaml'
              tasks_config = 'config/tasks.yaml'

              @agent
              def whatsapp_concierge(self) -> Agent:
                  return Agent(
                      config=self.agents_config['whatsapp_concierge'],
                      verbose=True
                  )

              @task
              def reply_whatsapp_task(self) -> Task:
                  return Task(
                      config=self.tasks_config['reply_whatsapp_task'],
                  )

              @crew
              def crew(self) -> Crew:
                  return Crew(
                      agents=self.agents,
                      tasks=self.tasks,
                      process=Process.sequential,
                      verbose=True,
                  )
          EOF

            cat << 'EOF' > src/taghazout_agency/main.py
          #!/usr/bin/env python
          import sys
          import warnings
          from taghazout_agency.crew import TaghazoutAgency

          warnings.filterwarnings("ignore", category=SyntaxWarning, module="pysbd")

          def run():
              inputs = {
                  'user_message': 'Salam, chhal katssawbo site de reservation?',
                  'sender_phone': '212600000000'
              }
              TaghazoutAgency().crew().kickoff(inputs=inputs)
          EOF

            uv lock
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-generated Taghazout Agency CrewAI project"
            git push
          fi
