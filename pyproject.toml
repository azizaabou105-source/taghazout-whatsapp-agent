[project]
name = "taghazout_agency"
version = "0.1.0"
description = "Taghazout Digital Agency WhatsApp Crew"
authors = [{ name = "Taghazout Digital Agency", email = "aouriraisolution@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
   "crewai[tools]>=1.0.0",
    "requests>=2.31.0"
]

[project.scripts]
taghazout_agency = "taghazout_agency.main:run"
run_crew = "taghazout_agency.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
